services:
  - type: web
    name: haiku
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --timeout 120
    envVars:
      - key: GOOGLE_API_KEY   # Gemini writes the haiku; set it in the Render dashboard
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: HIDE_TOOLS   # only the Voice and Music buttons are shown
        value: "1"
      - key: ELEVENLABS_API_KEY   # optional: read aloud and music
        sync: false
